<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Explore your selling options | Kustom</title><link rel="stylesheet" href="../assets/site.css?v=20260914b"><style>
/* ============================================================
   PALETTE

   Pulled from homebuyerswi.com's own CSS custom properties on
   2026-09-10, not invented:
     --color-brand-primary  #0ca0da   (link + brand blue)
     --color-brand-primary-darker  #086b91
     --color-brand-primary-lighter #3ec1f4
     --color-brand-secondary-dark  #065a79
     --color-brand-secondary-darker #021d27
     --color-brand-secondary-lighter #c5edfc
     --color-button         #ff8800   (their CTA orange)
     --color-button-darker  #b35f00
     --body-color           #373a3c
   Headings and body on their site are Source Sans Pro. Source Sans 3
   is the same family, current name, served by Google Fonts.

   IMPORTANT: the quiz engine at the bottom of this file writes inline
   `--c` / `--cs` values that point at the six situation names below.
   If you rename one here, rename it there too, or the cards lose their
   colour and selecting one stops showing.
   ============================================================ */
:root{
  /* six situation hues. Orange is deliberately NOT one of them, because
     orange is the client's action colour and has to stay unambiguous. */
  --violet:#6C5CE0;   --violet-soft:#EDEAFC;    /* inherited / estate     */
  --crimson:#D6353B;  --crimson-soft:#FBE7E8;   /* foreclosure / deadline */
  --gold:#C68A05;     --gold-soft:#FBF0D3;      /* needs work             */
  --brand:#0CA0DA;    --brand-soft:#DFF3FC;     /* rental                 */
  --emerald:#12A06B;  --emerald-soft:#DBF5EA;   /* moving by a date       */
  --slate:#5A6B82;    --slate-soft:#E9EDF3;     /* just working it out    */
  --amber:#FFB300;    --amber-soft:#FFF2D4;     /* flags and warnings     */

  /* the client's own action colour */
  --act:#FF8800; --act-2:#B35F00; --act-soft:#FFF0DE;

  --paper:#FFFFFF;
  --tint:#F4F9FC;
  --tint-2:#E7F2F8;
  --line:#DCE7EE;
  --line-2:#BFD3DF;

  --ink:#1A2530;
  --ink-2:#373A3C;
  --ink-soft:#5F7080;

  --night:#021D27;
  --night-2:#065A79;

  --r:20px; --r-sm:12px;
  --sh-sm:0 2px 4px rgba(2,29,39,.06);
  --sh:0 4px 12px rgba(2,29,39,.07), 0 18px 42px rgba(2,29,39,.10);
  --sh-lg:0 8px 22px rgba(2,29,39,.09), 0 34px 76px rgba(2,29,39,.15);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.55;font-size:17px;
  font-family:"Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
@media(max-width:780px){body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}}
h1,h2,h3,h4,h5{margin:0;font-family:"Source Sans 3","Source Sans Pro",sans-serif;font-weight:800;
  letter-spacing:-.022em;text-wrap:balance;line-height:1.06}
p{margin:0}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.eyebrow{display:inline-block;font-size:13px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:var(--act-2);
  background:var(--act-soft);padding:8px 16px;border-radius:999px}
.eyebrow.dark{color:#012A36;background:#7FE3FF}
:focus-visible{outline:3px solid var(--act);outline-offset:3px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-top:14px;padding-bottom:14px}
.blogo{height:46px;width:auto;display:block}
.hdr-right{display:flex;align-items:center;gap:18px}
.hdr-phone{font-weight:800;font-size:17px;text-decoration:none;white-space:nowrap}
.hdr-phone small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft)}
@media(max-width:660px){.hdr-cta{display:none}}
@media(max-width:430px){
  .blogo{height:32px}
  .hdr-phone{font-size:15px}
  .hdr-right{gap:10px}
  .wrap{padding:0 16px}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:18px;padding:18px 32px;
  border-radius:8px;text-decoration:none;letter-spacing:-.005em;
  transition:background .16s,transform .12s,box-shadow .16s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-act{background:var(--act);color:#fff;box-shadow:0 6px 0 0 var(--act-2)}
.btn-act:hover{background:#CC6D00;box-shadow:0 8px 0 0 var(--act-2)}
.btn-act:active{box-shadow:0 3px 0 0 var(--act-2)}
.btn-g{background:var(--act);color:#fff;box-shadow:0 6px 0 0 var(--act-2)}
.btn-g:active{box-shadow:0 3px 0 0 var(--act-2)}
.btn-line{background:#fff;border:2.5px solid var(--line-2);color:var(--ink)}
.btn-line:hover{border-color:var(--brand);background:var(--tint)}
.btn-ghost{background:rgba(255,255,255,.14);border:2.5px solid rgba(255,255,255,.5);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.btn-sm{font-size:15.5px;padding:12px 22px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--paper);padding:62px 0 70px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.42;pointer-events:none;z-index:0}
.b1{width:460px;height:460px;background:var(--brand);top:-190px;left:-140px}
.b2{width:400px;height:400px;background:var(--act);top:-150px;right:4%}
.b3{width:360px;height:360px;background:var(--brand);bottom:-200px;left:28%}
.b4{width:320px;height:320px;background:var(--emerald);bottom:-160px;right:-90px}
.hero .wrap{position:relative;z-index:2}
.hero h1{font-size:clamp(40px,7.2vw,80px);font-weight:900;margin-top:24px;max-width:15ch;
  line-height:1;letter-spacing:-.032em}
.hero h1 mark{background:linear-gradient(180deg,transparent 58%,var(--amber) 58%);
  color:inherit;padding:0 .05em;border-radius:3px}
.hero .lede{margin-top:26px;max-width:53ch;font-size:clamp(19px,2.1vw,23px);color:var(--ink-2);
  font-weight:400;line-height:1.45}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.chip{font-size:14px;font-weight:700;padding:9px 18px;border-radius:999px;
  background:#fff;border:2px solid var(--line);color:var(--ink-2)}

/* trust */
.trust{background:var(--tint);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;gap:0;padding-top:0;padding-bottom:0}
@media(min-width:800px){.trust .wrap{grid-template-columns:repeat(4,1fr)}}
.trust div{padding:28px 8px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
@media(min-width:800px){.trust div{border-bottom:0;justify-content:center}
  .trust div+div{border-left:1px solid var(--line)}}
.trust div:last-child{border-bottom:0}
.trust b{font-size:46px;font-weight:900;line-height:.9;color:var(--tn);letter-spacing:-.03em}
.trust span{font-size:15px;font-weight:700;color:var(--ink-2);max-width:15ch;line-height:1.3}

/* ---------- sections ---------- */
section{padding:76px 0}
.sec-h{font-size:clamp(30px,4.6vw,50px);font-weight:900;margin-top:20px;max-width:20ch;
  letter-spacing:-.028em;line-height:1.06}
.sec-p{margin-top:20px;max-width:62ch;font-size:19px;color:var(--ink-2);font-weight:400}
.on-tint{background:var(--tint);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* ---------- quiz ---------- */
#quiz{padding-top:62px}
.shell{background:#fff;border:2px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-lg);overflow:hidden;margin-top:34px}
.shell-top{background:var(--night);color:#fff;padding:24px 26px}
.shell-top .row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.shell-top .t{font-weight:800;font-size:20px;letter-spacing:-.018em}
.shell-top .s{font-size:13px;font-weight:800;background:rgba(255,255,255,.16);
  padding:7px 16px;border-radius:999px;white-space:nowrap}
.bar{height:10px;background:rgba(255,255,255,.16);border-radius:999px;margin-top:18px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg,var(--brand),var(--act));transition:width .4s cubic-bezier(.4,0,.2,1)}
.shell-body{padding:32px 22px 34px}
@media(min-width:760px){.shell-body{padding:44px 46px 46px}}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.q-h{font-size:clamp(27px,3.7vw,42px);font-weight:900;line-height:1.06;letter-spacing:-.026em}
.q-sub{margin-top:14px;font-size:18px;color:var(--ink-soft);max-width:55ch;font-weight:400}

/* option buttons */
.opts{display:grid;gap:13px;margin-top:32px}
@media(min-width:780px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
  background:var(--tint);border:2.5px solid transparent;border-radius:var(--r-sm);padding:20px 22px;
  font-family:inherit;font-size:18px;font-weight:600;color:var(--ink);
  transition:border-color .15s,background .15s,transform .12s,box-shadow .15s}
.opt:hover{border-color:var(--accent,var(--act));background:var(--accent-soft,var(--act-soft));
  transform:translateX(4px);box-shadow:var(--sh-sm)}
.opt .dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--line-2);flex:0 0 auto;
  background:#fff;transition:border-color .15s,background .15s}
.opt:hover .dot{border-color:var(--accent,var(--act));background:var(--accent,var(--act));
  box-shadow:inset 0 0 0 4px #fff}

/* ---------- situation cards ---------- */
.cards{display:grid;gap:16px;margin-top:32px}
@media(min-width:760px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--cs);border:3px solid transparent;border-radius:var(--r);
  padding:26px 26px 24px;color:var(--ink);
  transition:background .16s,border-color .16s,box-shadow .16s,transform .14s}
.card:hover{border-color:var(--c);transform:translateY(-4px);box-shadow:var(--sh)}
.card .tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 13px;border-radius:999px;background:var(--c);color:#fff}
.card h4{margin-top:16px;font-size:25px;font-weight:800;line-height:1.12;
  letter-spacing:-.022em;padding-right:38px}
.card p{margin-top:11px;font-size:16px;color:var(--ink-2);line-height:1.45;font-weight:400}
.card .also{margin-top:16px;padding-top:14px;font-size:14px;color:var(--ink-soft);line-height:1.45;
  border-top:2px solid rgba(26,37,48,.10)}
.card .tick{position:absolute;top:24px;right:24px;width:34px;height:34px;border-radius:50%;
  border:3px solid rgba(26,37,48,.14);background:#fff;display:flex;align-items:center;
  justify-content:center;font-size:18px;font-weight:900;color:transparent;transition:all .16s}

/* selected state: the whole card goes full colour */
.card.sel{background:var(--c);border-color:var(--c);color:#fff;
  box-shadow:0 12px 30px -8px var(--c);transform:translateY(-4px)}
.card.sel h4{color:#fff}
.card.sel p{color:rgba(255,255,255,.94)}
.card.sel .also{color:rgba(255,255,255,.88);border-top-color:rgba(255,255,255,.32)}
.card.sel .tag{background:rgba(255,255,255,.26);color:#fff}
.card.sel .tick{background:#fff;border-color:#fff;color:var(--c)}

/* Continue lives on the card the seller just tapped. visibility rather than
   display, so selecting one does not jolt the grid. */
.card-go{visibility:hidden;display:inline-flex;align-items:center;gap:11px;margin-top:22px;
  background:var(--act);color:#fff;border:2px solid rgba(255,255,255,.55);
  font-family:inherit;font-weight:800;font-size:16.5px;
  padding:13px 22px 13px 26px;border-radius:8px;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.20);
  transition:background .16s,box-shadow .16s,transform .14s}
.card.sel .card-go{visibility:visible}
.card-go::after{content:"";width:9px;height:9px;border-top:2.5px solid currentColor;
  border-right:2.5px solid currentColor;transform:rotate(45deg);margin-left:1px;
  transition:transform .16s}
.card-go:hover{background:var(--act-2);box-shadow:0 11px 24px rgba(0,0,0,.26);transform:translateY(-2px)}
.card-go:hover::after{transform:rotate(45deg) translate(2px,-2px)}
.card-go:active{transform:translateY(0);box-shadow:0 4px 12px rgba(0,0,0,.22)}
.card-go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.multi-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-top:30px;padding-top:26px;border-top:2px solid var(--line)}
.multi-bar .count{font-size:17px;font-weight:700;color:var(--ink-2)}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none!important}

.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:34px;
  padding-top:22px;border-top:2px solid var(--line)}
.back{background:none;border:0;font-family:inherit;font-size:16px;font-weight:700;
  color:var(--ink-soft);cursor:pointer;padding:8px 2px}
.back:hover{color:var(--ink)}
.trail{font-size:14px;color:var(--ink-soft);font-weight:700;text-align:right}

/* ---------- outcome ---------- */
.oc-flag{display:inline-block;font-size:13px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;padding:9px 17px;border-radius:999px;
  background:var(--c);color:#fff}
.oc-h{margin-top:22px;font-size:clamp(28px,4.1vw,46px);font-weight:900;
  line-height:1.06;letter-spacing:-.028em}
.oc-p{margin-top:20px;font-size:19px;color:var(--ink-2);max-width:62ch;font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.tags span{font-size:14px;font-weight:800;padding:8px 16px;border-radius:999px;
  background:var(--tc);color:#fff}

.nextup{margin-top:28px;background:var(--brand-soft);border:2.5px solid var(--brand);
  border-radius:var(--r);padding:24px 26px}
.nextup h5{margin:0;font-size:13px;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:#065A79}
.nextup p{margin-top:12px;font-size:17px;color:var(--ink-2);font-weight:400}

.combo{margin-top:24px;border:3px solid var(--crimson);background:var(--crimson-soft);
  border-radius:var(--r);padding:24px 26px}
.combo h5{margin:0;font-size:22px;font-weight:800;color:#A31E24;letter-spacing:-.02em}
.combo p{margin-top:12px;font-size:17px;color:#7A161B;font-weight:400}

.oc-note{margin-top:20px;background:var(--amber-soft);border:2.5px solid var(--amber);
  border-radius:var(--r-sm);padding:18px 22px;font-size:16.5px;color:var(--ink-2)}
.oc-note b{color:var(--ink)}

.oc-points{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:12px}
@media(min-width:760px){.oc-points{grid-template-columns:1fr 1fr}}
.oc-points li{display:flex;gap:13px;align-items:flex-start;background:var(--tint);
  border:2px solid var(--line);border-radius:var(--r-sm);padding:17px 19px;font-size:16.5px;font-weight:600}
.oc-points li b{color:var(--c);flex:0 0 auto;font-size:18px;line-height:1.35}
.ro-flag{display:inline-block;font-size:13px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;padding:9px 17px;border-radius:999px;
  background:var(--night);color:#fff}
.ro-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}

/* form */
.form{margin-top:38px;padding-top:34px;border-top:3px solid var(--line)}
.form h4{font-size:29px;font-weight:900;letter-spacing:-.026em}
.form .fh{margin-top:12px;font-size:17px;color:var(--ink-soft);max-width:57ch;font-weight:400}
.grid2{display:grid;gap:18px;margin-top:26px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
label.fl{display:block;font-size:15px;font-weight:800;margin-bottom:9px}
.in{width:100%;border:2.5px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;
  font-family:inherit;font-size:17px;background:#fff;color:var(--ink)}
.in:focus{outline:none;border-color:var(--act);box-shadow:0 0 0 4px var(--act-soft)}
textarea.in{resize:vertical}
.consent{display:flex;gap:14px;align-items:flex-start;margin-top:22px;background:var(--tint);
  border:2px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;font-size:16px;color:var(--ink-2)}
.consent input{margin-top:3px;width:22px;height:22px;accent-color:var(--act);flex:0 0 auto}
.consent a{color:#086B91;font-weight:700}
.form .btn-g,.form .btn-act{width:100%;margin-top:26px;font-size:20px;padding:22px 32px}
.fineprint{margin-top:18px;font-size:15px;color:var(--ink-soft);text-align:center}
.err{margin-top:20px;background:var(--crimson-soft);border:2.5px solid var(--crimson);
  border-radius:var(--r-sm);padding:16px 19px;font-size:16.5px;font-weight:700;color:#A31E24}

.done{text-align:center;padding:26px 0 10px}
.done .tick{width:88px;height:88px;border-radius:50%;background:var(--emerald);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;margin:0 auto;
  box-shadow:0 14px 34px -10px var(--emerald)}
.done h3{margin-top:28px;font-size:clamp(30px,4vw,44px);font-weight:900;letter-spacing:-.028em}
.done p{margin-top:20px;font-size:19px;color:var(--ink-2);max-width:52ch;margin-left:auto;
  margin-right:auto;font-weight:400}
.done .btn{margin-top:30px}

/* ---------- steps ---------- */
.steps{display:grid;gap:18px;margin-top:44px}
@media(min-width:720px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{background:var(--cs);border-radius:var(--r);padding:30px 26px}
.step .n{width:58px;height:58px;border-radius:16px;color:#fff;font-weight:900;font-size:27px;
  display:flex;align-items:center;justify-content:center;background:var(--c)}
.step h4{margin-top:22px;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.14}
.step p{margin-top:12px;font-size:16px;color:var(--ink-2);font-weight:400}

/* ---------- situations recap ---------- */
.sits{display:grid;gap:16px;margin-top:44px}
@media(min-width:660px){.sits{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.sits{grid-template-columns:repeat(3,1fr)}}
.sit{background:var(--cs);border-radius:var(--r);padding:28px 26px}
.sit h4{font-size:23px;font-weight:800;color:var(--c);letter-spacing:-.02em;line-height:1.12}
.sit p{margin-top:12px;font-size:16px;color:var(--ink-2);font-weight:400}

/* ---------- local stock ---------- */
.stock{display:grid;gap:14px;margin-top:40px}
@media(min-width:720px){.stock{grid-template-columns:repeat(3,1fr)}}
.st{background:#fff;border:2px solid var(--line);border-radius:var(--r-sm);padding:22px 22px}
.st h5{margin:0;font-size:17px;font-weight:800;color:var(--night-2);letter-spacing:-.015em}
.st p{margin-top:9px;font-size:15.5px;color:var(--ink-2);font-weight:400;line-height:1.45}
.statline{display:grid;gap:16px;margin-top:40px}
@media(min-width:700px){.statline{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--night);color:#fff;border-radius:var(--r);padding:28px 26px}
.stat b{display:block;font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;color:#7FE3FF}
.stat span{display:block;margin-top:12px;font-size:16px;color:#BBD3DE;font-weight:400}

/* ---------- guide ---------- */
.guide{border-radius:var(--r);padding:44px 34px;display:grid;gap:32px;align-items:center;
  background:var(--night);color:#fff;position:relative;overflow:hidden}
.guide::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;
  background:var(--brand);filter:blur(80px);opacity:.34;top:-160px;right:-110px;pointer-events:none}
@media(min-width:880px){.guide{grid-template-columns:1.2fr .95fr;padding:54px 56px}}
.guide>*{position:relative;z-index:1}
.guide h3{font-size:clamp(30px,4vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1.06;
  margin-top:20px}
.guide p{margin-top:20px;color:#B5CEDA;font-size:18px;max-width:48ch;font-weight:400}

/* ---------------- state ---------------- */
var S=null, lead=null;

function has(k){ return S.situations.indexOf(k)>=0; }

function start(){
  S={situations:[],primary:null,phase:"pick",i:0,answers:{},history:[]};
  render(false);
}

function toggleSit(k){
  var ex=BRANCHES[k].exclusive;
  if(has(k)){ S.situations=S.situations.filter(function(x){return x!==k;}); }
  else if(ex){ S.situations=[k]; }
  else { S.situations=S.situations.filter(function(x){return !BRANCHES[x].exclusive;}); S.situations.push(k); }
  render(false);
}

function confirmSits(){
  if(!S.situations.length) return;
  if(S.situations.length===1){ S.primary=S.situations[0]; S.phase="q"; S.i=0; }
  else { S.phase="priority"; }
  render(true);
}

function setPrimary(k){ S.primary=k; S.phase="q"; S.i=0; render(true); }

/* The merged queue: primary asks everything, every other situation
   asks only the questions marked key. Common questions run once. */
function queue(){
  var out=[], seen={};
  if(!S || !S.primary) return out;   /* part of the public handoff API, must not throw */
  function push(bk,q){ if(seen[q.id]) return; if(q.when&&!q.when(S.answers,S.primary,has)) return; seen[q.id]=1; out.push({b:bk,q:q}); }
  BRANCHES[S.primary].qs.forEach(function(q){ push(S.primary,q); });
  S.situations.forEach(function(k){
    if(k===S.primary) return;
    BRANCHES[k].qs.forEach(function(q){ if(q.key) push(k,q); });
  });
  COMMON.forEach(function(q){ push("common",q); });
  return out;
}

function answer(id,v,q){
  S.answers[id]=v;
  S.history.push({id:id,q:q,a:v});
  if(routeOut(S.answers)){ S.phase="outcome"; render(true); return; }
  var qq=queue();
  var next=-1;
  for(var j=0;j<qq.length;j++){ if(S.answers[qq[j].q.id]===undefined){ next=j; break; } }
  if(next<0){ S.phase="outcome"; } else { S.i=next; }
  render(true);
}

function back(){
  if(!S.history.length){
    if(S.situations.length>1){ S.phase="priority"; S.primary=null; render(true); return; }
    start(); return;
  }
  var last=S.history.pop();
  delete S.answers[last.id];
  var qq=queue(), idx=0;
  for(var j=0;j<qq.length;j++){ if(qq[j].q.id===last.id){ idx=j; break; } }
  S.i=idx; S.phase="q";
  render(true);
}

function routeOut(a){
  if(a.title==="No, I rent here") return "renter";
  if(a.location==="Outside Wisconsin") return "outofarea";
  if(a.listed==="Yes, it is listed now") return "listed";
  if(a.listed==="It is under contract") return "contract";
  return null;
}

/* ---------------- fit engine ---------------- */
function tier(){
  var a=S.answers;
  if(routeOut(a)) return {t:"X",why:"routed out"};
  var soon=a.timeline==="As soon as possible"||a.timeline==="Within 30 days";
  var mid=a.timeline==="Thirty to ninety days"||a.timeline==="It depends on the numbers";
  var canSign=a.title==="Yes, I am the owner"||a.title==="I am the personal representative, or I hold power of attorney";
  var partial=a.title==="Yes, one of several owners"||a.title==="No, I am family helping out";
  if(has("deadline")&&a.dateset==="Yes, within 30 days") return {t:"A",why:"date inside 30 days"};
  if(a.backtaxes==="Behind by more than a year") return {t:"A",why:"taxes more than a year delinquent"};
  if(S.situations.length>2) return {t:"A",why:"three or more situations stacked, high motivation"};
  if(has("comparing")) return (a.stage==="Ready to move if the numbers work"&&canSign&&soon)
    ? {t:"B",why:"researching but ready"} : {t:"C",why:"research stage"};
  if(has("condition")&&a.motivation==="No, I would stay"&&S.situations.length===1) return {t:"C",why:"condition problem, not motivation"};
  if(has("inherited")&&(a.agreed==="No, we are not agreed"||a.agreed==="We have not discussed it")) return {t:"B",why:"heirs not aligned"};
  if(has("moving")&&a.bothagree==="Not yet") return {t:"B",why:"both parties not agreed"};
  if(canSign&&soon) return {t:"A",why:"can sign, inside 30 days"};
  if(canSign&&mid) return {t:"B",why:"can sign, 30 to 90 days"};
  if(partial&&(soon||mid)) return {t:"B",why:"second signature needed"};
  if(a.timeline==="More than 90 days") return {t:"C",why:"more than 90 days out"};
  return {t:"B",why:"no urgency signal"};
}

/* Pairs involving the most pressing situation come first, and we show
   at most two. Three stacked red boxes stop being a warning and start
   being wallpaper, and the overlapping pairs repeat each other. */
function activeCombos(){
  var out=[], s=S.situations.slice().sort();
  for(var i=0;i<s.length;i++) for(var j=i+1;j<s.length;j++){
    var c=COMBOS[s[i]+"|"+s[j]];
    if(c) out.push({c:c, prim:(s[i]===S.primary||s[j]===S.primary)?0:1});
  }
  out.sort(function(a,b){return a.prim-b.prim;});
  return out.slice(0,2).map(function(x){return x.c;});
}

/* ---------------- render ---------------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function render(scroll){
  var body=document.getElementById("qBody"), shell=document.getElementById("shell");
  var m=S.primary?BRANCHES[S.primary]:null;
  shell.style.setProperty("--accent",m?m.c:"var(--brand)");
  shell.style.setProperty("--accent-soft",m?m.cs:"var(--brand-soft)");
  document.getElementById("qTitle").textContent =
    S.situations.length ? S.situations.map(function(k){return BRANCHES[k].label;}).join(" + ") : "Your property, your options";

  var pct,label;
  if(S.phase==="pick"){ pct=4; label="About two minutes"; }
  else if(S.phase==="priority"){ pct=10; label="Nearly started"; }
  else if(S.phase==="outcome"){ pct=100; label="Your options"; }
  else if(S.phase==="done"){ pct=100; label="Preview complete"; }
  else{
    var qq=queue(), answered=0;
    qq.forEach(function(it){ if(S.answers[it.q.id]!==undefined) answered++; });
    pct=Math.max(12,Math.round(answered/(qq.length+1)*100));
    label=pct<35?"Just started":pct<70?"Halfway":"Almost there";
  }
  document.getElementById("qBar").style.width=pct+"%";
  document.getElementById("qStep").textContent=label;

  var h="";
  if(S.phase==="pick") h=pickHtml();
  else if(S.phase==="priority") h=priorityHtml();
  else if(S.phase==="done") h=doneHtml();
  else if(S.phase==="outcome") h=outcomeHtml();
  else h=questionHtml();

  body.innerHTML=h;
  if(scroll) document.getElementById("shell").scrollIntoView({behavior:"smooth",block:"start"});
}

var ZIP_STATE=[["AL",350,369],["AK",995,999],["AZ",850,865],["AR",716,729],["CA",900,961],

["KS",660,679],["KY",400,427],["LA",700,714],["ME",39,49],["MD",206,219],["MA",10,27],

["NV",889,898],["NH",30,38],["NJ",70,89],["NM",870,884],["NY",100,149],["NC",270,289],
["ND",580,588],["OH",430,459],["OK",730,749],["OR",970,979],["PA",150,196],["RI",28,29],
["SC",290,299],["SD",570,577],["TN",370,385],["TX",750,799],["UT",840,847],["VT",50,59],
["VA",220,246],["WA",980,994],["WV",247,268],["WI",530,549],["WY",820,831]];
function stateFromZip(z){
  var d=(z||"").replace(/\D/g,"");
  if(d.length<5) return "";
  var p=parseInt(d.slice(0,3),10);
  for(var i=0;i<ZIP_STATE.length;i++){
    if(p>=ZIP_STATE[i][1]&&p<=ZIP_STATE[i][2]) return ZIP_STATE[i][0];
  }
  return "";
}
function zipState(v){
  var el=document.getElementById("zipState");
  if(!el) return;
  var st=stateFromZip(v);
  DERIVED_STATE=st;
  el.textContent = st ? "State: "+st+". Tell us on the call if that is wrong."
                      : ((v||"").replace(/\D/g,"").length>=5 ? "We will confirm the state on the call." : "");
}
var DERIVED_STATE="";

function fld(l,n,t,ac){
  return '<div><label class="fl" for="'+n+'">'+esc(l)+'</label>'
    +'<input class="in" id="'+n+'" name="'+n+'" type="'+t+'" autocomplete="'+ac+'"></div>';
}
function val(id){ var e=document.getElementById(id); return e?e.value.trim():""; }

/* Builds the plain language summary that goes into the CRM note field, so
   whoever picks the phone up has the whole picture without opening a
   payload. Describes the SITUATION, never a price or a structure. */
function leadSummary(t){
  var a=S.answers, out=[];
  var who=(val("firstName")+" "+val("lastName")).trim();
  var where=[val("city"),DERIVED_STATE,val("zip")].filter(Boolean).join(", ");
  out.push(who+" enquired through the website funnel about "+(val("address")||"a property")+
           (where?", "+where:"")+".");
  if(S.situations.length){
    out.push("Situation: "+S.situations.map(function(k){return BRANCHES[k].label;}).join(", ")+".");
  }
  activeCombos().forEach(function(c){ out.push("Note: "+c.t+"."); });
  var facts=[];
  if(a.timeline)  facts.push("timeline "+a.timeline.toLowerCase());
  if(a.title)     facts.push("ownership: "+a.title.toLowerCase());
  if(a.occupancy) facts.push("occupancy: "+a.occupancy.toLowerCase());
  if(a.equity)    facts.push("mortgage: "+a.equity.toLowerCase());
  if(a.backtaxes) facts.push("property taxes: "+a.backtaxes.toLowerCase());
  if(a.issue)     facts.push("condition: "+a.issue.toLowerCase());
  if(a.propertyType) facts.push("property type: "+a.propertyType.toLowerCase());
  if(a.listed)    facts.push("listing status: "+a.listed.toLowerCase());
  if(a.offers)    facts.push("offers so far: "+a.offers.toLowerCase());
  if(facts.length) out.push("They told us "+facts.join("; ")+".");
  if(a.priceExpectation) out.push("Price expectation: "+a.priceExpectation+".");
  out.push("Preferred contact: "+(val("contactPref")||"not stated")+
           ", best time "+(val("bestTime")||"not stated")+".");
  out.push("Lead tier "+t.t+" ("+t.why+").");
  if(BRANCHES[S.primary].extra && val(BRANCHES[S.primary].extra.name)){
    out.push("Their notes: "+val(BRANCHES[S.primary].extra.name));
  }
  return out.join(" ");
}

function submitLead(){
  var errBox=document.getElementById("formErr");
  var first=val("firstName"),last=val("lastName"),phone=val("phone"),email=val("email"),
      addr=val("address"),city=val("city"),zip=val("zip"),
      state=DERIVED_STATE||stateFromZip(zip);
  var consent=document.getElementById("consent"), problems=[];
  if(!first) problems.push("your first name");
  if(!last) problems.push("your last name");
  if(!phone&&!email) problems.push("a phone number or an email address");
  if(!addr) problems.push("the property address");
  if(!city) problems.push("the city");
  if(zip.replace(/\D/g,"").length<5) problems.push("the ZIP code");

  if(problems.length){ errBox.innerHTML='<div class="err">We still need '+problems.join(", ")+'.</div>'; return; }

  var m=BRANCHES[S.primary], t=tier();
  lead={
    situations:S.situations,
    primarySituation:S.primary,
    combinations:activeCombos().map(function(c){return c.t;}),
    leadTier:t.t,
    tierReason:t.why,
    answers:S.history,
    contact:{firstName:first, lastName:last, fullName:(first+" "+last).trim(),
             phone:phone, email:email,
             address:addr, city:city, state:state, zip:zip,
             propertyType:S.answers.propertyType||"",
             priceExpectation:S.answers.priceExpectation||"",
             bestTime:val("bestTime"), contactPreference:val("contactPref")},
    /* Consent is recorded with its timestamp and the page it was given
       on, which the A2P record requires. */
    consent:{given:!!(consent && consent.checked), at:new Date().toISOString(), page:location.href},
    /* Its own source value so this channel stays separate from every
       other form on homebuyerswi.com in CRM reporting. */
    leadSource:"Website Funnel",
    tags:["Website Funnel","Tier "+t.t],
    summary:leadSummary(t),
    notes:m.extra?val(m.extra.name):"",
    submittedAt:new Date().toISOString(),
    utm:utm()
  };
  /* ---- WIRE THIS UP -----------------------------------------
     POST `lead` to the CRM webhook, then keep the success screen.
     Front end only right now, nothing is being sent anywhere. Do not
     ship this to paid traffic until the POST is in and a real test
     submission has been seen landing in the CRM.
  ------------------------------------------------------------ */
  /* Preview only: no transmission, PII logging or conversion event. */
  S.phase="done"; render(true);
}

function getGuide(e){ e.preventDefault(); location.href="../resource-page/"; return false; }

function utm(){
  var o={},p=new URLSearchParams(window.location.search);
  ["utm_source","utm_medium","utm_campaign","utm_term","utm_content","gclid","oppref"].forEach(function(k){
    if(p.get(k)) o[k]=p.get(k);
  });
  return o;
}

/* Paint the config into the static markup so there is one source of truth. */
function applyConfig(){
  document.querySelectorAll("[data-cfg]").forEach(function(el){
    var k=el.getAttribute("data-cfg");
    if(CONFIG[k]!==undefined) el.textContent=CONFIG[k];
  });
  document.querySelectorAll("[data-cfg-href]").forEach(function(el){
    var k=el.getAttribute("data-cfg-href");
    if(CONFIG[k]!==undefined) el.setAttribute("href",CONFIG[k]);
  });
  document.title = CONFIG.company;
}

/* An ad can land straight on its own branch with ?s=deadline, so the
   seller never re-picks something the ad already told us. */
function deepLink(){
  var k=new URLSearchParams(window.location.search).get("s");
  if(k && BRANCHES[k]){ toggleSit(k); confirmSits(); }
}

/* The assistant hands the seller's answers back into this quiz.
   Exported explicitly rather than relying on implicit globals. */
window.funnelQuiz = {
  start:       start,
  toggleSit:   toggleSit,
  confirmSits: confirmSits,
  answer:      answer,
  queue:       queue,
  state:       function(){ return S; },
  /* jump past the remaining questions to the result and the contact
     fields, used when the assistant has already asked enough */
  showOutcome: function(){ if(S&&S.primary){ S.phase="outcome"; render(true); } }
};

applyConfig();
start();
deepLink();


/* ============================================================
   ASSISTANT (demo)

   Scripted on purpose. No API key and no network call, so it works
   offline and cannot fail in front of a prospect. Text only: no voice
   output and no microphone, because voice is not part of what is sold
   here.

   It runs the same qualification the page's quiz runs, then hands the
   seller into the form rather than pretending to book anything itself.

   Set ASSISTANT_ON = false at the top of the previous script to remove
   it entirely.
   ============================================================ */
(function(){
  var launch=document.getElementById("vaLaunch"), panel=document.getElementById("vaPanel"),
      body=document.getElementById("vaBody"), chips=document.getElementById("vaChips");
  if(!launch||!panel) return;
  if(typeof ASSISTANT_ON!=="undefined" && !ASSISTANT_ON){
    launch.remove(); panel.remove(); return;
  }

  var started=false, ended=false, answers={};

  function bubble(text,who){
    var d=document.createElement("div");
    d.className="va-msg "+who; d.textContent=text;
    body.appendChild(d); body.scrollTop=body.scrollHeight;
  }
  function typing(on){
    var t=document.getElementById("vaTyping");
    if(on&&!t){
      t=document.createElement("div"); t.className="va-typing"; t.id="vaTyping";
      t.innerHTML="<i></i><i></i><i></i>";
      body.appendChild(t); body.scrollTop=body.scrollHeight;
    } else if(!on&&t){ t.remove(); }
  }
  function bot(text,then){
    typing(true);
    setTimeout(function(){
      typing(false); bubble(text,"bot");
      if(then) then();
    }, Math.min(1100, 340+text.length*7));
  }
  function setChips(list){
    chips.innerHTML="";
    list.forEach(function(c){
      var b=document.createElement("button");
      b.className="va-chip"+(c.go?" go":""); b.type="button"; b.textContent=c.t;
      b.onclick=function(){ if(c.act){ bubble(c.t,"me"); setChips([]); c.act(); } else { choose(c); } };
      chips.appendChild(b);
    });
  }

  var SITUATIONS=[
    {t:"I inherited it", k:"inherited", ack:"Sorry to hear that, and thank you for telling me."},
    {t:"I'm behind on payments or taxes", k:"deadline", ack:"Right, that changes what we should be looking at, and it changes how fast."},
    {t:"It needs a lot of work", k:"condition", ack:"That is very common on a house of this age here, and it is not the problem people think it is."},
    {t:"It's a rental", k:"rental", ack:"Understood. You do not have to get the tenant out for this to work."},
    {t:"I need to move by a date", k:"moving", ack:"Got it. A fixed date narrows things down usefully."},
    {t:"I'm just looking at options", k:"comparing", ack:"No problem at all, nothing wrong with working it out first."}
  ];
  var TIMELINES=[
    {t:"As soon as possible", k:"asap"},
    {t:"Within a month", k:"asap"},
    {t:"Two or three months", k:"mid"},
    {t:"No particular rush", k:"slow"}
  ];
  var EQUITY=[
    {t:"It's paid off", k:"free"},
    {t:"I owe less than half", k:"low"},
    {t:"I owe about half", k:"half"},
    {t:"I owe close to what it's worth", k:"thin"},
    {t:"I owe more than it's worth", k:"under"},
    {t:"I'm not sure", k:"unknown"}
  ];

  var STEP=0;

  function choose(c){
    bubble(c.t,"me");
    if(STEP===1){ answers.situation=c.k; answers.situationLabel=c.t; askTimeline(c.ack); }
    else if(STEP===2){ answers.timeline=c.k; askEquity(); }
    else if(STEP===3){ answers.equity=c.k; recommend(); }
    else if(STEP===4){ closeOut(c.k); }
  }

  function askSituation(){
    STEP=1;
    setChips(SITUATIONS.map(function(x){return {t:x.t,k:x.k,ack:x.ack};}));
  }
  function askTimeline(ack){
    STEP=2; setChips([]);
    bot(ack+" How soon are you hoping to have this sorted?", function(){ setChips(TIMELINES); });
  }
  function askEquity(){
    STEP=3; setChips([]);
    bot("And is there still a mortgage on the property?", function(){ setChips(EQUITY); });
  }
  function recommend(){
    STEP=4; setChips([]);
    /* No number and no structure is named. The team works it out from the
       answers and brings a real figure to the call. */
    bot("Thanks, that gives us what we need to look at it properly. Somebody can go through the property "+
        "and come back to you with a real number. Would you like a call back?",
      function(){
        setChips([{t:"Yes please",k:"yes",go:true},{t:"Not yet, send the guide",k:"guide"}]);
      });
  }

  /* Carry what the seller already told the assistant into the page's own
     quiz, so it never asks the same three questions twice. */
  var TIMELINE_MAP={asap:"As soon as possible", mid:"Thirty to ninety days", slow:"More than 90 days"};
  var EQUITY_MAP={free:"It is paid off, no mortgage", low:"I owe less than half of what it is worth",
    half:"I owe about half", thin:"I owe close to what it is worth",
    under:"I owe more than it is worth", unknown:"I am not sure"};

  function seed(Q,id,value){
    if(!value) return false;
    var qq=Q.queue();
    for(var i=0;i<qq.length;i++){
      if(qq[i].q.id===id && qq[i].q.opts.indexOf(value)>=0){ Q.answer(id,value,qq[i].q.q); return true; }
    }
    return false;
  }

  function prefill(){
    var map={phone:answers.phone, bestTime:answers.bestTime, contactPref:answers.contactPref};
    Object.keys(map).forEach(function(id){
      var el=document.getElementById(id);
      if(el && map[id]) el.value=map[id];
    });
  }

  function handoff(){
    close();
    var carried=0, Q=window.funnelQuiz;
    try{
      if(Q && answers.situation){
        Q.start();
        Q.toggleSit(answers.situation);
        Q.confirmSits();
        carried++;                                                  /* the situation */
        if(seed(Q,"timeline", TIMELINE_MAP[answers.timeline])) carried++;
        if(seed(Q,"equity",   EQUITY_MAP[answers.equity]))     carried++;
        if(Q.showOutcome) Q.showOutcome();   /* skip the rest, go to the contact fields */
        prefill();
      }
    }catch(e){
      if(window.console) console.warn("[assistant] handoff failed, seller starts the quiz fresh:", e);
    }
    var q=document.getElementById("quiz");
    if(q) q.scrollIntoView({behavior:"smooth",block:"start"});
    ended=true;
    return carried;
  }

  function askCallback(){
    bot("Of course. What is the best number to call you back on today, and is there a particular time that would suit you?",
      callbackForm);
  }

  function callbackForm(){
    chips.innerHTML="";
    var wrap=document.createElement("div"); wrap.className="va-form";
    var inp=document.createElement("input");
    inp.className="va-input"; inp.type="tel"; inp.placeholder="Your best number";
    inp.setAttribute("aria-label","Your best number"); inp.setAttribute("autocomplete","tel");
    wrap.appendChild(inp);

    var chosen="Any time today";
    var row=document.createElement("div"); row.className="va-chips";
    ["Any time today","Morning","Afternoon","Evening"].forEach(function(t){
      var b=document.createElement("button"); b.type="button";
      b.className="va-chip"+(t===chosen?" sel":""); b.textContent=t;
      b.onclick=function(){
        chosen=t;
        for(var i=0;i<row.children.length;i++) row.children[i].className="va-chip";
        b.className="va-chip sel";
      };
      row.appendChild(b);
    });
    wrap.appendChild(row);

    var go=document.createElement("button"); go.type="button";
    go.className="va-chip go"; go.textContent="That is my number";
    go.onclick=function(){
      var v=(inp.value||"").trim();
      if(v.replace(/\D/g,"").length<7){
        inp.style.borderColor="var(--crimson)";
        inp.placeholder="A number we can actually reach you on";
        return;
      }
      answers.phone=v; answers.bestTime=chosen;
      bubble(v+", "+chosen.toLowerCase(),"me");
      chips.innerHTML="";
      askPref();
    };
    wrap.appendChild(go);
    chips.appendChild(wrap);
  }

  function askPref(){
    bot("Thank you. And would you rather we called you first, or sent you a text first?", function(){
      setChips([
        {t:"A call is fine", act:function(){ answers.contactPref="A call is fine"; wrapUp(); }},
        {t:"Text me first",  act:function(){ answers.contactPref="Text me first";  wrapUp(); }},
        {t:"Either is fine", act:function(){ answers.contactPref="Either is fine"; wrapUp(); }}
      ]);
    });
  }

  function wrapUp(){
    bot("Perfect. I will carry all of that across so nobody asks you the same thing twice, and take you straight to the last few details.",
      function(){ setChips([{t:"Carry on",go:true,act:handoff}]); });
  }

  function closeOut(k){
    setChips([]);
    if(k==="yes"){ askCallback(); }
    else {
      bot("No problem. The guide walks through the numbers, and it is yours either way. Nobody will chase you.",
        function(){
          setChips([
            {t:"Send me the guide",go:true,act:function(){ ended=true; close(); if(window.getGuide) window.getGuide({preventDefault:function(){}}); }},
            {t:"Thanks, that's all",act:function(){ ended=true; bot("Take care. We are here whenever you want to pick it back up."); }}
          ]);
        });
    }
  }

  function open(){
    panel.hidden=false; launch.hidden=true;
    /* reopening after it finished used to show a dead transcript with no buttons */
    if(ended){ ended=false; started=false; STEP=0; answers={}; body.innerHTML=""; setChips([]); }
    if(!started){
      started=true;
      var name=(window.CONFIG&&window.CONFIG.company)||"Kustom Property Solutions";
      bot("Hi, you are through to "+name+". I can help you work out what your house is actually worth to you, and it takes about a minute. Can I ask what is going on with the property?",
        askSituation);
    }
  }
  function close(){ panel.hidden=true; launch.hidden=false; }
  launch.onclick=open;
  document.getElementById("vaClose").onclick=close;
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!panel.hidden) close(); });
})();
</script><script>new ResizeObserver(()=>{parent.postMessage({type:"kustom-height",height:document.body.scrollHeight},location.origin)}).observe(document.body);</script></body></html>
